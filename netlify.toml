# TexLink Egypt — Netlify Free Deployment Configuration
# Strict $0.00 zero-cost configuration supporting Next.js 15 App Router & Prisma 6

[build]
  command = "npm run db:generate:postgres && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_ENABLED = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
